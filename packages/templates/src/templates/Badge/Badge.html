<template name="Badge">
  <span
    data-tpl="Badge"
    data-role="badge"
    class="er-badge"
    data-shape="{{shape}}"
    data-placement="{{placement}}"
    data-font-px="{{fontSize}}"
    data-bg="{{bgColor}}"
    data-ink="{{color}}"
    data-pad="{{padding}}"
    style="--er-badge-bg: {{bgColor}}; --er-badge-ink: {{color}}; --er-font-px: {{fontSize}}px; --er-badge-pad: {{padding}}px"
    ><span class="er-badge__icon" data-slot="icon" data-if="icon"></span
    ><span class="er-badge__text er-md" data-if="text">{{text}}</span></span
  >
</template>
