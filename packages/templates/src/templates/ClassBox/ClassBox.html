<template name="ClassBox">
  <div
    data-tpl="ClassBox"
    data-role="body"
    class="er-classbox"
    data-border="{{borderStyle}}"
    data-style="{{styleMode}}"
    data-font-px="{{fontSize}}"
    data-color="{{color}}"
    data-tint-color="{{tintColor}}"
    data-divider-color="{{dividerColor}}"
    data-bg="{{bgColor}}"
    data-border-color="{{borderColor}}"
    data-title-bg="{{titleBgColor}}"
    data-h-align="{{hAlign}}"
    data-italic="{{italic}}"
    data-washtex-css="{{washTexCss}}"
    style="--er-resolved-divider: {{dividerColor}}; --er-resolved-tint: {{tintColor}}; --er-color: {{color}}; --er-bg: {{bgColor}}; --er-border: {{borderColor}}; --er-title-bg: {{titleBgColor}}; --er-font-px: {{fontSize}}px; --f: var(--font-{{typeface}}, var(--font-clean))"
  >
    <div class="er-classbox__frame">
      <span class="er-washtex" data-if="washTexCss" aria-hidden="true"
        ><svg width="100%" height="100%">
          <filter
            id="wcc-{{washUid}}"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
          >
            <feMorphology operator="dilate" radius="5"></feMorphology>
            <feGaussianBlur stdDeviation="7"></feGaussianBlur>
          </filter>
          <mask id="wcf-{{washUid}}">
            <rect
              class="er-washmask"
              width="100%"
              height="100%"
              fill="#fff"
              filter="url(#wcc-{{washUid}})"
            ></rect>
          </mask>
          <g mask="url(#wcf-{{washUid}})">
            <use
              href="#{{washSym}}"
              x="-6%"
              y="-6%"
              width="112%"
              height="112%"
            ></use>
          </g></svg
      ></span>
      <header class="er-classbox__head" data-part="title" data-port="header">
        <div class="er-classbox__head-text">
          <div class="er-classbox__stereotype" data-if="stereotype">{{stereotype}}</div>
          <h4 class="er-classbox__title" data-role="internal-text">{{label}}</h4>
        </div>
        <span class="er-classbox__icon" data-slot="icon" data-if="icon"></span>
      </header>
      <div
        class="er-classbox__sections"
        data-each="s of sections"
        data-key="name"
      >
        <section class="er-classbox__section" data-part="section">
          <h5 class="er-classbox__section-name" data-if="s.name">{{s.name}}</h5>
          <ul class="er-classbox__items" data-each="m of s.items" data-key="name">
            <li
              class="er-classbox__item"
              data-part="field"
              data-port-prefix="field:"
              data-italic="{{m.italic}}"
              data-underline="{{m.underline}}"
            >
              <span class="er-classbox__m-name" data-port-name="">{{m.name}}</span>
              <span class="er-classbox__m-type" data-part="field-type">{{m.type}}</span>
              <span class="er-classbox__m-meta">{{m.meta}}</span>
            </li>
          </ul>
        </section>
      </div>
    </div>
    <span data-use="Badge" data-props="badge" data-if="badge"></span>
  </div>
</template>
