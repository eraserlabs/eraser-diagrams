<template name="Relationship">
  <div
    data-tpl="Relationship"
    data-role="body"
    class="er-rel"
    data-line-style="{{lineStyle}}"
    data-font-px="{{fontSize}}"
    data-label-color="{{labelColor}}"
    style="--er-stroke: {{color}}; --er-line-w: {{lineWidthPx}}px; --er-font-px: {{fontSize}}px; --er-label-ink: {{labelColor}}"
  >
    <svg class="er-rel__svg">
      <defs>
        <!-- triangle: 10 x lineWidth long, 9 x lineWidth wide (the canvas rule). Stroke px is
             lineWidth x 1.75, so in stroke-width units the head is 10 / 1.75 = 5.71 long. -->
        <marker
          id="er-ah-triangle"
          markerUnits="strokeWidth"
          markerWidth="5.71"
          markerHeight="5.14"
          viewBox="0 0 10 9"
          refX="10"
          refY="4.5"
          orient="auto-start-reverse"
        >
          <path d="M 0,0 L 10,4.5 L 0,9 Z" fill="context-stroke"></path>
        </marker>
        <!-- arrow: a fixed 12 px chevron at every line width (the canvas rule); its stroke is
             the line's own stroke, read from --er-line-w on the template root, and overflows
             the 12 x 11 viewport so a thick stroke is not clipped at the tip and arms. -->
        <marker
          id="er-ah-arrow"
          markerUnits="userSpaceOnUse"
          overflow="visible"
          markerWidth="12"
          markerHeight="11"
          viewBox="0 0 12 11"
          refX="12"
          refY="5.5"
          orient="auto-start-reverse"
        >
          <path
            class="er-rel__head-arrow"
            d="M 0,0 L 12,5.5 L 0,11"
            fill="none"
            stroke="context-stroke"
          ></path>
        </marker>
        <marker
          id="er-ah-bar"
          markerUnits="strokeWidth"
          markerWidth="2.31"
          markerHeight="11.54"
          viewBox="0 0 3 15"
          refX="1.5"
          refY="7.5"
          orient="auto-start-reverse"
        >
          <path
            d="M 1.5,0 L 1.5,15"
            fill="none"
            stroke="context-stroke"
            stroke-width="1.5"
          ></path>
        </marker>
        <marker
          id="er-ah-dot"
          markerUnits="strokeWidth"
          markerWidth="6.15"
          markerHeight="6.15"
          viewBox="0 0 8 8"
          refX="4"
          refY="4"
          orient="auto-start-reverse"
        >
          <circle cx="4" cy="4" r="3.5" fill="context-stroke"></circle>
        </marker>
        <marker
          id="er-ah-crowFootSingle"
          markerUnits="strokeWidth"
          markerWidth="6.15"
          markerHeight="7.69"
          viewBox="0 0 8 10"
          refX="8"
          refY="5"
          orient="auto-start-reverse"
        >
          <path
            d="M 4,0 L 4,10 M 0,5 L 8,5"
            fill="none"
            stroke="context-stroke"
            stroke-width="1.3"
          ></path>
        </marker>
        <marker
          id="er-ah-crowFootMany"
          markerUnits="strokeWidth"
          markerWidth="7.69"
          markerHeight="7.69"
          viewBox="0 0 10 10"
          refX="10"
          refY="5"
          orient="auto-start-reverse"
        >
          <path
            d="M 0,5 L 10,0 M 0,5 L 10,5 M 0,5 L 10,10"
            fill="none"
            stroke="context-stroke"
            stroke-width="1.3"
          ></path>
        </marker>
        <marker
          id="er-ah-crowFootOnlyOne"
          markerUnits="strokeWidth"
          markerWidth="9.23"
          markerHeight="7.69"
          viewBox="0 0 12 10"
          refX="12"
          refY="5"
          orient="auto-start-reverse"
        >
          <path
            d="M 4,0 L 4,10 M 8,0 L 8,10 M 0,5 L 12,5"
            fill="none"
            stroke="context-stroke"
            stroke-width="1.3"
          ></path>
        </marker>
        <marker
          id="er-ah-crowFootZeroOrOne"
          markerUnits="strokeWidth"
          markerWidth="13.85"
          markerHeight="7.69"
          viewBox="0 0 18 10"
          refX="18"
          refY="5"
          orient="auto-start-reverse"
        >
          <path
            d="M 13,0 L 13,10 M 8,5 L 18,5"
            fill="none"
            stroke="context-stroke"
            stroke-width="1.3"
          ></path>
          <circle
            cx="4.5"
            cy="5"
            r="3.5"
            fill="var(--er-surface, #ffffff)"
            stroke="context-stroke"
            stroke-width="1.3"
          ></circle>
        </marker>
        <marker
          id="er-ah-crowFootOneOrMany"
          markerUnits="strokeWidth"
          markerWidth="10.77"
          markerHeight="7.69"
          viewBox="0 0 14 10"
          refX="14"
          refY="5"
          orient="auto-start-reverse"
        >
          <path
            d="M 3,0 L 3,10 M 0,5 L 14,5 M 5,5 L 14,0 M 5,5 L 14,10"
            fill="none"
            stroke="context-stroke"
            stroke-width="1.3"
          ></path>
        </marker>
        <marker
          id="er-ah-crowFootZeroOrMany"
          markerUnits="strokeWidth"
          markerWidth="14.62"
          markerHeight="7.69"
          viewBox="0 0 19 10"
          refX="19"
          refY="5"
          orient="auto-start-reverse"
        >
          <path
            d="M 8,5 L 19,5 M 10,5 L 19,0 M 10,5 L 19,10"
            fill="none"
            stroke="context-stroke"
            stroke-width="1.3"
          ></path>
          <circle
            cx="4.5"
            cy="5"
            r="3.5"
            fill="var(--er-surface, #ffffff)"
            stroke="context-stroke"
            stroke-width="1.3"
          ></circle>
        </marker>
        <marker
          id="er-ah-hollowTriangle"
          markerUnits="strokeWidth"
          markerWidth="9.23"
          markerHeight="9.23"
          viewBox="0 0 12 12"
          refX="11.5"
          refY="6"
          orient="auto-start-reverse"
        >
          <path
            d="M 1,1 L 11,6 L 1,11 Z"
            fill="var(--er-surface, #ffffff)"
            stroke="context-stroke"
            stroke-width="1.3"
            stroke-linejoin="round"
          ></path>
        </marker>
        <marker
          id="er-ah-hollowDiamond"
          markerUnits="strokeWidth"
          markerWidth="11.54"
          markerHeight="8.46"
          viewBox="0 0 15 11"
          refX="14.5"
          refY="5.5"
          orient="auto-start-reverse"
        >
          <path
            d="M 1,5.5 L 7.5,1 L 14,5.5 L 7.5,10 Z"
            fill="var(--er-surface, #ffffff)"
            stroke="context-stroke"
            stroke-width="1.3"
            stroke-linejoin="round"
          ></path>
        </marker>
        <marker
          id="er-ah-filledDiamond"
          markerUnits="strokeWidth"
          markerWidth="11.54"
          markerHeight="8.46"
          viewBox="0 0 15 11"
          refX="14.5"
          refY="5.5"
          orient="auto-start-reverse"
        >
          <path
            d="M 1,5.5 L 7.5,1 L 14,5.5 L 7.5,10 Z"
            fill="context-stroke"
            stroke="context-stroke"
            stroke-width="1.3"
            stroke-linejoin="round"
          ></path>
        </marker>
      </defs>
      <path
        data-role="anchor"
        class="er-rel__line"
        d="{{ }}"
        marker-start="{{startMarker}}"
        marker-end="{{endMarker}}"
      ></path>
    </svg>
    <span
      data-role="external-text"
      data-text-grow-policy="balanced"
      class="er-rel__label er-md"
      data-part="label"
      data-if="label"
      style="--f: var(--font-{{typeface}}, var(--font-clean))"
      >{{label}}</span
    >
  </div>
</template>
