<template name="Shape">
  <div
    data-tpl="Shape"
    data-role="body"
    class="er-shape er-style--{{styleMode}}"
    data-shape="{{shape}}"
    data-border="{{borderStyle}}"
    data-border-px="{{borderWidth}}"
    data-style="{{styleMode}}"
    data-icon-pad="{{iconPadding}}"
    data-icon-size="{{iconProps.size}}"
    data-font-px="{{fontSize}}"
    data-color="{{color}}"
    data-fill-color="{{fillColor}}"
    data-tint-color="{{tintColor}}"
    data-bg="{{bgColor}}"
    data-border-color="{{borderColor}}"
    data-text-ink="{{textInk}}"
    data-body-ink="{{bodyInk}}"
    data-washtex-css="{{washTexCss}}"
    data-washtex-geo="{{washTexGeo}}"
    style="--er-resolved-fill: {{fillColor}}; --er-color: {{color}}; --er-bg: {{bgColor}}; --er-border: {{borderColor}}; --er-authored-border-width: {{borderWidth}}px; --er-text-ink: {{textInk}}; --er-body-ink: {{bodyInk}}; --er-resolved-tint: {{tintColor}}; --er-icon-pad: {{iconPadding}}px; --er-icon-ink: {{iconColor}}; --er-v-margin: {{vMargin}}px; --er-font-px: {{fontSize}}px; --er-font-num: {{fontSize}}"
  >
    <svg
      class="er-shape__geo er-shape__geo--dynamic"
      data-if="geoPath"
      viewBox="0 0 {{geoW}} {{geoH}}"
      aria-hidden="true"
    >
      <path
        data-if="geoShadowPath"
        class="er-shape__shadow"
        d="{{geoShadowPath}}"
        clip-path="path(evenodd, '{{geoShadowClip}}') view-box"
      ></path>
      <g data-if="washTexGeo">
        <defs>
          <filter
            id="wcb-{{washUid}}"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
          >
            <feMorphology operator="dilate" radius="5"></feMorphology>
            <feGaussianBlur stdDeviation="7"></feGaussianBlur>
          </filter>
          <filter
            id="wcbf-{{washUid}}"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%"
          >
            <feGaussianBlur stdDeviation="1.5"></feGaussianBlur>
          </filter>
          <mask id="wcg-{{washUid}}">
            <path
              class="er-shape__washmask"
              d="{{geoPath}}"
              fill="#fff"
              filter="url(#wcb-{{washUid}})"
            ></path>
            <path
              data-if="geoWashFloorPath"
              class="er-shape__washmask-floor"
              d="{{geoWashFloorPath}}"
              fill="#fff"
              filter="url(#wcbf-{{washUid}})"
            ></path>
          </mask>
          <clipPath id="wcgc-{{washUid}}">
            <path d="{{geoPath}}"></path>
          </clipPath>
        </defs>
        <!-- Mask keeps the interior organic; the clip terminates the wash at the drawn outline. -->
        <g mask="url(#wcg-{{washUid}})" clip-path="url(#wcgc-{{washUid}})">
          <use
            href="#{{washSym}}"
            x="-14"
            y="-14"
            width="{{washUseW}}"
            height="{{washUseH}}"
          ></use>
        </g>
      </g>
      <path
        class="er-shape__path er-shape__path--dynamic"
        d="{{geoPath}}"
      ></path>
      <path
        data-if="geoInnerPath"
        class="er-shape__inner-border"
        d="{{geoInnerPath}}"
      ></path>
      <path
        data-if="geoCapPath"
        class="er-shape__cap er-shape__cap--dynamic"
        d="{{geoCapPath}}"
      ></path>
    </svg>
    <svg
      class="er-shape__geo"
      data-if="staticGeo"
      viewBox="0 0 100 100"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <path
        class="er-shape__path er-shape__path--parallelogram"
        d="M 15.3846,0 L 100,0 L 84.6154,100 L 0,100 Z"
      ></path>
      <path
        class="er-shape__path er-shape__path--trapezoid"
        d="M 20.6186,0 L 79.3814,0 L 100,100 L 0,100 Z"
      ></path>
      <path
        class="er-shape__path er-shape__path--diamond"
        d="M 50,0 L 100,50 L 50,100 L 0,50 Z"
      ></path>
      <path
        class="er-shape__path er-shape__path--hexagon"
        d="M 0,50 L 25,99.7965 L 75,99.7965 L 100,50 L 75,0.2035 L 25,0.2035 Z"
      ></path>
      <path
        class="er-shape__path er-shape__path--triangle"
        d="M 50,0 L 0,100 L 100,100 Z"
      ></path>
      <path
        class="er-shape__path er-shape__path--star"
        d="M 50,0 L 66.1641,28.3024 L 97.5528,38.0041 L 76.1541,65.1976 L 79.3893,99.4959 L 50,88 L 20.6107,99.4959 L 23.8459,65.1976 L 2.4472,38.0041 L 33.8359,28.3024 Z"
      ></path>
      <path
        class="er-shape__path er-shape__path--document"
        d="M 0.87,6.67 C 0.87,3.47 3.41,1 6.53,1 H 93.3 C 96.4,1 99,3.51 99,7 V 77.7 C 98.9,86.3 95.1,89.9 91.3,88.8 C 85.1,87.1 76.1,85.1 68.5,85.1 C 55.4,85.1 44.3,98.1 28,98.1 C 15.2,98.1 5.9,90.8 2.45,87.6 C 0.87,86.7 0.87,85.2 0.87,83.9 V 6.67 Z"
      ></path>
      <path
        class="er-shape__path er-shape__path--cylinder-body"
        d="M 0,11 L 0,89 A 50,11 0 0 0 100,89 L 100,11 A 50,11 0 0 0 0,11"
      ></path>
      <path
        class="er-shape__cap er-shape__path--cylinder-cap"
        d="M 0,11 A 50,11 0 0 0 100,11"
      ></path>
      <path
        class="er-shape__inner-border er-shape__inner-border--static er-shape__inner-border--parallelogram"
        d="M 20.96,6.5 L 92.42,6.5 L 79.04,93.5 L 7.58,93.5 Z"
      ></path>
      <path
        class="er-shape__inner-border er-shape__inner-border--static er-shape__inner-border--trapezoid"
        d="M 25.92,6.5 L 74.08,6.5 L 92.02,93.5 L 7.98,93.5 Z"
      ></path>
      <path
        class="er-shape__inner-border er-shape__inner-border--static er-shape__inner-border--diamond"
        d="M 50,9.19 L 90.81,50 L 50,90.81 L 9.19,50 Z"
      ></path>
      <path
        class="er-shape__inner-border er-shape__inner-border--static er-shape__inner-border--hexagon"
        d="M 7.27,50 L 29.01,93.3 L 70.99,93.3 L 92.73,50 L 70.99,6.7 L 29.01,6.7 Z"
      ></path>
      <path
        class="er-shape__inner-border er-shape__inner-border--static er-shape__inner-border--triangle"
        d="M 50,14.53 L 10.52,93.5 L 89.48,93.5 Z"
      ></path>
      <path
        class="er-shape__inner-border er-shape__inner-border--static er-shape__inner-border--star"
        d="M 50,10.08 L 62.8,32.5 L 89.12,40.63 L 70.99,63.68 L 73.65,91.88 L 50,82.63 L 26.35,91.88 L 29.01,63.68 L 10.88,40.63 L 37.2,32.5 Z"
      ></path>
      <path
        class="er-shape__inner-border er-shape__inner-border--static er-shape__inner-border--document"
        d="M 7.26 12.3 C 7.26 9.52 9.47 7.5 12.18 7.5 H 87.67 C 90.37 7.5 92.63 9.55 92.63 13.5 V 74.1 C 92.54 81.58 89.24 84.71 85.93 83.76 C 80.54 82.28 72.71 80.54 66.1 80.54 C 54.7 80.54 45.04 91.85 30.86 91.85 C 19.72 91.85 11.63 85.5 8.63 82.71 C 7.26 81.93 7.26 80.62 7.26 79.49 V 12.24 Z"
      ></path>
      <path
        class="er-shape__inner-border er-shape__inner-border--static er-shape__inner-border--cylinder"
        d="M 6.5 16.07 L 6.5 83.93 A 43.5 9.57 0 0 0 93.5 83.93 L 93.5 16.07 A 43.5 9.57 0 0 0 6.5 16.07"
      ></path>
    </svg>
    <div class="er-shape__inner" data-v-align="{{vAlign}}">
      <span class="er-washtex" data-if="washTexCss" aria-hidden="true"
        ><svg width="100%" height="100%">
          <filter
            id="wcc-{{washUid}}"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
          >
            <feMorphology operator="dilate" radius="5"></feMorphology>
            <feGaussianBlur stdDeviation="7"></feGaussianBlur>
          </filter>
          <mask id="wcf-{{washUid}}">
            <rect
              class="er-washmask"
              width="100%"
              height="100%"
              fill="#fff"
              filter="url(#wcc-{{washUid}})"
            ></rect>
          </mask>
          <g mask="url(#wcf-{{washUid}})">
            <use
              href="#{{washSym}}"
              x="-6%"
              y="-6%"
              width="112%"
              height="112%"
            ></use>
          </g></svg
      ></span>
      <span
        class="er-shape__icon"
        data-part="icon"
        data-slot="icon"
        data-if="icon"
      ></span>
      <div
        class="er-shape__texts"
        data-part="label"
        data-role="internal-text"
        data-text-grow-policy="balanced"
        data-text-max-lines="3"
        data-text-word-growth="1.5"
        data-text-aspect="{{textAspectRatio}}"
        data-each="t of texts"
        data-key="text"
      >
        <div
          class="er-shape__text er-md"
          data-part="text-run"
          data-index
          data-h-align="{{t.hAlign}}"
          data-run-px="{{t.fontSize}}"
          data-underline="{{t.underline}}"
          style="--f: var(--font-{{t.typeface}}, var(--font-clean)); --er-ink: {{t.color}}; --er-run-px: {{t.fontSize}}px"
        >
          {{t.text}}
        </div>
      </div>
    </div>
    <span data-use="Badge" data-props="badge" data-if="badge"></span>
  </div>
</template>
